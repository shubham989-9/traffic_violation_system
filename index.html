<!DOCTYPE html>
<html>
<head>
<title>Smart Traffic Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{background:#0b1220;color:white}
.card{background:#0f1a2f}
img{border-radius:10px}
</style>
</head>

<body class="p-4">

<h2>🚦 Smart Traffic Violation Detection</h2>

<div class="row mt-3">
  <div class="col-md-7">
    <div class="card p-2 mb-3">
      <h5>Live Camera</h5>
      <img src="/video_feed" width="100%">
      <a class="btn btn-light btn-sm mt-2" href="/download_csv">📥 Download CSV</a>
    </div>

    <div class="card p-3">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <div class="col-md-5">
    <div class="card p-3 mb-3">
      <h5>Upload Image</h5>
      <form action="/upload_image" method="post" enctype="multipart/form-data">
        <input class="form-control mb-2" type="file" name="image_file" required>
        <button class="btn btn-primary w-100">Process Image</button>
      </form>
    </div>

    <div class="card p-3 mb-3">
      <h5>Upload Video</h5>
      <form action="/upload_video" method="post" enctype="multipart/form-data">
        <input class="form-control mb-2" type="file" name="video_file" required>
        <button class="btn btn-danger w-100">Process Video</button>
      </form>
    </div>

    {% with msgs = get_flashed_messages() %}
    {% if msgs %}
    <div class="alert alert-info">{{ msgs[-1] }}</div>
    {% endif %}
    {% endwith %}
  </div>
</div>

<div class="card p-3 mt-4">
<h5>📝 Recent Violations</h5>
<table class="table table-dark table-sm">
<tr><th>Time</th><th>Vehicle</th><th>Violation</th><th>Plate</th></tr>
{% for r in rows %}
<tr><td>{{r[0]}}</td><td>{{r[1]}}</td><td>{{r[2]}}</td><td>{{r[3]}}</td></tr>
{% endfor %}
</table>
</div>

<script>
fetch("/stats").then(r=>r.json()).then(data=>{
 var ctx=document.getElementById("chart");
 new Chart(ctx,{
   type:"bar",
   data:{
     labels:Object.keys(data),
     datasets:[{data:Object.values(data)}]
   }
 });
});
</script>

</body>
</html>
